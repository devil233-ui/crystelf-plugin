<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{title}}</title>
    <style>
        :root {
            color-scheme: light;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            padding: 32px;
            overflow-x: hidden;
            background: #edf0f2;
            color: #27313d;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
            letter-spacing: 0;
        }

        .container {
            width: 100%;
            max-width: 736px;
            margin: 0 auto;
            overflow: hidden;
            background: #ffffff;
            border: 1px solid #d7dde2;
            border-top: 5px solid #159878;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(25, 35, 45, 0.1);
        }

        .header {
            padding: 30px 38px 26px;
            border-bottom: 1px solid #e6eaed;
        }

        .source {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            color: #08775d;
            font-size: 17px;
            font-weight: 650;
            line-height: 1.4;
            overflow-wrap: anywhere;
        }

        .source-mark {
            width: 10px;
            height: 10px;
            flex: 0 0 10px;
            background: #159878;
            border-radius: 2px;
        }

        h1 {
            margin: 0;
            color: #18212b;
            font-size: 36px;
            font-weight: 720;
            line-height: 1.3;
            overflow-wrap: anywhere;
        }

        .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 22px;
            margin-top: 18px;
            color: #69747f;
            font-size: 17px;
            line-height: 1.5;
        }

        .meta-label {
            margin-right: 7px;
            color: #929ba3;
        }

        .content {
            padding: 30px 38px 34px;
            color: #27313d;
            font-size: 26px;
            line-height: 1.55;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        #crystelf-super-text > :first-child {
            margin-top: 0;
        }

        #crystelf-super-text > :last-child {
            margin-bottom: 0;
        }

        .content p,
        .content ul,
        .content ol,
        .content blockquote,
        .content pre,
        .content table,
        .content figure {
            margin-top: 0;
            margin-bottom: 16px;
        }

        .content p:empty {
            display: none;
        }

        .content ul,
        .content ol {
            padding-left: 1.2em;
        }

        .content li + li {
            margin-top: 12px;
        }

        .content li > p {
            margin-bottom: 0;
        }

        .content h2,
        .content h3,
        .content h4 {
            margin: 28px 0 14px;
            color: #18212b;
            line-height: 1.35;
        }

        .content h2 {
            font-size: 31px;
        }

        .content h3,
        .content h4 {
            font-size: 28px;
        }

        .content a {
            color: #096cc1;
            text-decoration-color: #9fc5e4;
            text-decoration-thickness: 1px;
            text-underline-offset: 4px;
        }

        .content img {
            display: block;
            width: auto;
            max-width: 100%;
            height: auto;
            margin: 18px auto;
            object-fit: contain;
            background: #ffffff;
            border: 1px solid #dde2e6;
            border-radius: 6px;
        }

        .content img.emoji {
            display: inline-block;
            width: 1.2em;
            height: 1.2em;
            margin: 0 0.12em;
            border: 0;
            border-radius: 0;
            vertical-align: -0.2em;
            background: transparent;
        }

        .content img.miyoushe-emoji {
            display: inline-block;
            width: 1.6em;
            height: 1.6em;
            margin: 0 0.12em;
            object-fit: contain;
            border: 0;
            border-radius: 0;
            vertical-align: -0.42em;
            background: transparent;
        }

        .content .miyoushe-link-cards {
            margin: 18px 0 16px;
        }

        .content a.miyoushe-link-card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px;
            background: #f3f5f7;
            border: 1px solid #e1e5e8;
            border-radius: 6px;
            color: #27313d;
            text-decoration: none;
        }

        .content a.miyoushe-link-card + a.miyoushe-link-card {
            margin-top: 10px;
        }

        .content a.miyoushe-inline-card {
            margin: 18px 0 16px;
        }

        .content a.miyoushe-inline-card + a.miyoushe-inline-card {
            margin-top: -6px;
        }

        .content img.miyoushe-link-card-cover {
            width: 84px;
            height: 64px;
            flex: 0 0 84px;
            margin: 0;
            object-fit: cover;
            border: 0;
            border-radius: 5px;
        }

        .miyoushe-link-card-body {
            display: flex;
            min-width: 0;
            flex-direction: column;
            gap: 3px;
        }

        .miyoushe-link-card-label {
            color: #8a949d;
            font-size: 15px;
            line-height: 1.3;
        }

        .miyoushe-link-card-title {
            color: #27313d;
            font-size: 20px;
            font-weight: 650;
            line-height: 1.4;
            overflow-wrap: anywhere;
        }

        .content .miyoushe-topics {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 16px 0 2px;
        }

        .content .miyoushe-topics span {
            padding: 5px 11px;
            background: #f0f2f3;
            border-radius: 999px;
            color: #65717b;
            font-size: 16px;
            line-height: 1.35;
        }

        .content .miyoushe-list-item {
            display: flex;
            gap: 10px;
        }

        .content .miyoushe-list-item > span {
            flex: 0 0 auto;
            color: #65717b;
        }

        .content .miyoushe-divider {
            height: 1px;
            margin: 26px 0;
            background: #dfe4e7;
            border: 0;
        }

        .content .miyoushe-backup-text {
            margin: 18px 0;
            padding: 15px 18px;
            background: #f5f7f8;
            border-left: 4px solid #8c99a3;
            color: #4b555f;
            font-size: 22px;
        }

        .content .miyoushe-backup-text > :last-child {
            margin-bottom: 0;
        }

        .content .lightbox-wrapper,
        .content .ql-image,
        .content .ql-image-box,
        .content figure {
            max-width: 100%;
            height: auto;
        }

        .content .lightbox-wrapper {
            margin: 18px 0 20px;
        }

        .content .lightbox-wrapper img,
        .content figure img {
            margin: 0 auto;
        }

        .content blockquote {
            padding: 14px 18px;
            background: #fff6f3;
            border-left: 4px solid #dc6a55;
            color: #4b555f;
        }

        .content blockquote > :last-child {
            margin-bottom: 0;
        }

        .content code {
            padding: 2px 6px;
            background: #f0f3f5;
            border-radius: 4px;
            color: #9f3544;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
            font-size: 0.86em;
        }

        .content pre {
            max-width: 100%;
            padding: 18px 20px;
            overflow-x: auto;
            background: #1d2730;
            border-radius: 6px;
            color: #edf2f5;
            font-size: 19px;
            line-height: 1.55;
            white-space: pre-wrap;
        }

        .content pre code {
            padding: 0;
            background: transparent;
            color: inherit;
            font-size: inherit;
        }

        .content small {
            display: inline-block;
            padding: 7px 11px;
            background: #f0f3f5;
            border-radius: 4px;
            color: #63707b;
            font-size: 17px;
            line-height: 1.45;
        }

        .content table {
            width: 100%;
            border-collapse: collapse;
            font-size: 21px;
        }

        .content th,
        .content td {
            padding: 10px 12px;
            border: 1px solid #dce1e5;
            text-align: left;
            vertical-align: top;
        }

        .content th {
            background: #f3f5f6;
        }

        .footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 18px 38px;
            background: #f7f9fa;
            border-top: 1px solid #e3e7ea;
            color: #7b858e;
            font-size: 15px;
            line-height: 1.4;
        }

        .original-link {
            color: #08775d;
            font-weight: 650;
            text-decoration: none;
        }

        .credit {
            color: #9aa2a9;
        }
    </style>
</head>
<body>
<article class="container">
    <header class="header">
        <div class="source">
            <span class="source-mark"></span>
            <span>{{sourceTitle}}</span>
        </div>
        <h1>{{title}}</h1>
        <div class="meta">
            <span><span class="meta-label">发布于</span>{{date}}</span>
        </div>
    </header>

    <main class="content">
        {{content}}
    </main>

    <footer class="footer">
        <a class="original-link" href="{{link}}" target="_blank">查看原文</a>
        <span class="credit">Created by devil233-ui/crystelf-plugin</span>
    </footer>
</article>
</body>
</html>
